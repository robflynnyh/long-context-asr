global:
  root_path: /mnt/parscratch/users/acp21rjf/spotify/checkpoints_CONCAT_seq_scheduler_rb/n_seq_sched_
  name: rb_n_seq_sched
  overlap_ratio: 0.875
  checkpoint: step_105360.pt
  description: "rotary base 90M param model, decoding using windowed attention on tedlium, when whole test set is concatenated and the model is trained with concatenation"
  

models:

  - name: ${global.name}
    repeat: 1
    seq_len: 360000
    overlap_ratio: ${global.overlap_ratio}
    path: ${global.root_path}${.seq_len}_rp_${.repeat}/${global.checkpoint}
    description: ${global.description}
  # - name: ${global.name}
  #   repeat: 2
  #   seq_len: 360000
  #   overlap_ratio: ${global.overlap_ratio}
  #   path: ${global.root_path}${.seq_len}_rp_${.repeat}/${global.checkpoint}
  #   description: ${global.description}
  # - name: ${global.name}
  #   repeat: 3
  #   seq_len: 360000
  #   overlap_ratio: ${global.overlap_ratio}
  #   path: ${global.root_path}${.seq_len}_rp_${.repeat}/${global.checkpoint}
  #   description: ${global.description}

args:
  verbose: true
  model_class: SCConformerXL
  save_dataframe_path: './results/evals_rb_train_concat_notateval.csv'
  evaluation_mode: windowed_attention
  max_sequence_length: 3600000
  run_eval_with: run

datasets:
  - name: tedlium
    splits: [test]