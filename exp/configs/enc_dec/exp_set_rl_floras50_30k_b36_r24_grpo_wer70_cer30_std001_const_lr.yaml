template_info:
  create: 2
  include_keys: [
    'model',
    'optimizer',
    'scheduler',
    'audio_chunking',
    'wandb',
    'checkpointing',
    'data',
    'training',
    'rl',
    'model_class'
  ]
  template_keys: [
    'optimizer.args.lr',
    'wandb.name',
    'checkpointing.dir'
  ]

model:
  feat_in: 80
  n_layers: 5
  d_model: 768
  ctc_loss_weight: 0.05
  acoustic_norm: false
  additional_embeddings: 0

optimizer:
  name: madgrad
  args:
    lr: [1e-5, 1e-6]

scheduler:
  name: constant
  warmup_steps: 0

audio_chunking:
  size: 2048
  overlap: 0

wandb:
  use: true
  project_name: floras50_enc_dec_grpo_rl
  name: [
    rob26-enc-dec-3l-no-anorm-v2-grpo-30k-b36-r24-wer70-cer30-std001-lr1e-5,
    rob26-enc-dec-3l-no-anorm-v2-grpo-30k-b36-r24-wer70-cer30-std001-lr1e-6
  ]
  id: ""
  dir: /mnt/parscratch/users/acp21rjf/symphony-job-artifacts/ROB-26/wandb
  update_config_with_wandb_id: false

checkpointing:
  pretrained: /mnt/parscratch/users/acp21rjf/spotify/checkpoints/enc_dec/enc_dec_no_anorm_V2_lr_2e3_ctcw_0_05/step_210720.pt
  dir: [
    /mnt/parscratch/users/acp21rjf/symphony-job-artifacts/ROB-26/checkpoints/rl_floras50_30k_b36_r24_grpo_wer70_cer30_std001_const_lr_1e-5,
    /mnt/parscratch/users/acp21rjf/symphony-job-artifacts/ROB-26/checkpoints/rl_floras50_30k_b36_r24_grpo_wer70_cer30_std001_const_lr_1e-6
  ]
  save_every_n_steps: 2000

data:
  path: /users/acp21rjf/align_floras50/tmp/mapping.json

training:
  max_steps: 30000
  batch_size: 36
  clip_value: 0.8
  random_seed: 552268
  dtype: bfloat16
  num_workers: 0
  pin_memory: true
  prefetch_factor: null

rl:
  algorithm: grpo
  num_rollouts: 24
  temperature: 0.8
  max_generate: target_length
  max_generate_buffer: 8
  advantage_eps: 1e-6
  # Reward is: clamp(reward_offset - reward_scale * (wer_weight * WER + cer_weight * CER)).
  # Set reward_positive_threshold to recover the old thresholded behaviour; null disables it.
  reward_type: weighted_error
  reward_wer_weight: 0.7
  reward_cer_weight: 0.3
  reward_offset: 1.0
  reward_scale: 1.0
  reward_min: 0.0
  reward_max: null
  reward_positive_threshold: null
  # Groups with rollout reward std <= this value get zeroed advantages/skipped.
  reward_std_min: 0.01
  shuffle_chunks: true

model_class: EncDecSconformerV2
