  warmup_steps: 100

audio_chunking:
  size: 2048
  overlap: 0

wandb:
  use: true
  project_name: floras50_enc_dec_supervised
  name: rob81-supervised-floras50-safe-norm-drop-oov-lr1e-4-12ep-b22
  id: ""
  dir: /mnt/parscratch/users/acp21rjf/symphony-job-artifacts/ROB-81/wandb
  update_config_with_wandb_id: false

checkpointing:
  pretrained: /mnt/parscratch/users/acp21rjf/spotify/checkpoints/enc_dec/enc_dec_no_anorm_V2_lr_2e3_ctcw_0_05/step_210720.pt
  dir: /mnt/parscratch/users/acp21rjf/symphony-job-artifacts/ROB-81/checkpoints/supervised_floras50_spotifytok_safe_norm_drop_oov_lr1e-4_12ep_b22
  save_every_n_steps: 2000

data:
