template_info:
  create: 15 # number of experiments to create
  include_keys: [
    'model', 
    'optimizer', 
    'scheduler', 
    'audio_chunking', 
    'wandb', 
    'checkpointing', 
    'data', 
    'training', 
    # 'sequence_scheduler', 
    'description',
    'model_class',
    'spec_augment'
  ] # keys to include in experiments config
  template_keys: [
    'checkpointing.dir', 
    'checkpointing.pretrained',
    'wandb.name', 
    'model.attention_window_size',
    'training.random_seed',
    'audio_chunking.size',
  ] # keys to use to create experiments

model_class: 'SCConformerXL'
description: "Here we are looking at testing finetuning with long-only data, when intiial training used full dataset."

model:
  feat_in: 80
  n_layers: 18
  d_model: 1024
  n_heads: 8
  head_dim: 128
  dropout_ff: 0.0 # dropout parameters
  dropout_attn: 0.0
  dropout_conv: 0.0
  subsampling_factor: 8 # subsampling parameters
  subsampling: 'dw_striding'
  subsampling_act: 'silu'
  subsampling_conv_channels: 256
  self_condition_subsampling: false
  subsampling_norm_out: false
  conv_kernel_size: 9
  qk_rms_norm: false 
  shift_kvs: false
  self_conditioning: true
  gated_sc: false
  decoder_norm: true
  use_rotary: true
  encoder_mode: 'conformer'
  default_norm: 'layer_norm'
  sandwich_norm: false
  bias_in_ff: false
  checkpoint_every_n_layers: 1
  ff_checkpoint_lvl: 2 # recompute pre_act and gelu_out in the bwd pass
  rotary_base_freq: 1500000 # https://arxiv.org/pdf/2309.16039.pdf
  attention_window_size: [
    128, # 2048
    128,
    128,
    512, # 8192
    512,
    512,
    2048, # 32768
    2048,
    2048,
    8192, # 131072
    8192,
    8192,
    22500, # 360000
    22500,
    22500,
    # -1, # -1
    # -1,
    # -1,

  ]

optimizer:
  name: 'madgrad'
  args:
    lr: 5e-5

scheduler:
  warmup_steps: 5000

audio_chunking: # 360000 (max = 1 hour)
  size: [
    360000, # 2048
    360000,
    360000,
    360000, # 8192
    360000,
    360000,
    360000, # 32768
    360000,
    360000,
    360000, # 131072
    360000,
    360000,
    360000, # 360000
    360000,
    360000,
  ]
  overlap: 0 # not using currently...

