model_class: 'SCConformerXL'
description: "ROB-70 BEST-RQ SSL CPU smoke test for the standard 6L 2048-frame acoustic setup."

model:
  feat_in: 80
  n_layers: 6
  d_model: 768
  n_heads: 6
  head_dim: 128
  dropout_ff: 0.0
  dropout_attn: 0.0
  dropout_conv: 0.0
  subsampling_factor: 8
  subsampling: 'dw_striding'
  subsampling_act: 'silu'
  subsampling_conv_channels: 256
  self_condition_subsampling: false
  subsampling_norm_out: false
  conv_kernel_size: 9
  qk_rms_norm: false
  shift_kvs: false
  self_conditioning: true
  gated_sc: false
  decoder_norm: true
  use_rotary: true
  encoder_mode: 'conformer'
  default_norm: 'layer_norm'
  sandwich_norm: false
  bias_in_ff: false
  checkpoint_every_n_layers: 0
  rotary_base_freq: 1500000

best_rq:
  mask_percentage: 1.0
  frames_to_mask: 5
  downsampling_factor: 8
  codebook_size: 8192
  codebook_dim: 16

optimizer:
  name: 'madgrad'
  args:
    lr: 3e-3

scheduler:
  warmup_steps: 5000

audio_chunking:
  size: 2048
  overlap: 0

wandb:
  use: false
  project_name: "spotify_long_context_ssl"
  name: "rob70_bestrq_6l_2048_smoke"
  id: ""
  dir: '/mnt/parscratch/users/acp21rjf/wandb_log/'

checkpointing:
  dir: '/mnt/parscratch/users/acp21rjf/symphony-job-artifacts/ROB-70/smoke-checkpoints'
  save_every_n_steps: 1

data:
  path: '/mnt/parscratch/users/acp21rjf/spotify/audio_txt_pairs.json'

training:
  batch_size: 1
  backprop_every: 1
  backwards_every: 1
  max_epochs: 1
  max_steps: 1
  max_chunks_per_recording: 1
  clip_value: 0.8
  random_seed: 1234
  dtype: 'float32'
