model_class: 'SCConformerXL'
description: "ROB-100 short BEST-RQ SSL ablation: paper-style 48% masking, self-conditioning disabled."

model:
  feat_in: 80
  n_layers: 6
  d_model: 768
  n_heads: 6
  head_dim: 128
  dropout_ff: 0.0
  dropout_attn: 0.0
  dropout_conv: 0.0
  subsampling_factor: 8
  subsampling: 'dw_striding'
  subsampling_act: 'silu'
  subsampling_conv_channels: 256
  self_condition_subsampling: false
  subsampling_norm_out: false
  conv_kernel_size: 9
  qk_rms_norm: false
  shift_kvs: false
  self_conditioning: false
  gated_sc: false
  decoder_norm: true
  use_rotary: true
  encoder_mode: 'conformer'
  default_norm: 'layer_norm'
  sandwich_norm: false
  bias_in_ff: false
  checkpoint_every_n_layers: 0
  rotary_base_freq: 1500000

best_rq:
  mask_mode: "speechbrain"
  mask_prob: 0.12
  mask_length: 4
  downsampling_factor: 8
  codebook_size: 8192
  codebook_dim: 16

optimizer:
  name: 'madgrad'
  args:
    lr: 3e-4

scheduler:
  warmup_steps: 5000

audio_chunking:
  size: 2048
  overlap: 0

wandb:
  use: true
  project_name: "spotify_long_context_ssl"
  name: "rob100_papermask_ablation_sc_off_20260520"
  id: ""
  dir: '/mnt/parscratch/users/acp21rjf/wandb_log/'
  watch_model: false

checkpointing:
  dir: '/mnt/parscratch/users/acp21rjf/symphony-job-artifacts/ROB-100/papermask-ablation-checkpoints'
  save_every_n_steps: 2

data:
  path: '/mnt/parscratch/users/acp21rjf/spotify/audio_txt_pairs.json'

training:
  batch_size: 1
  backprop_every: 1
  backwards_every: 1
  max_epochs: 1
  max_steps: 4
  max_chunks_per_recording: 1
  clip_value: 0.8
  random_seed: 1234
  dtype: 'bfloat16'
